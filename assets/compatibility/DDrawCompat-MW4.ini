# MechWarrior 4: Vengeance presentation profile.
# The game requests a 1024x768 fullscreen surface. DDrawCompat keeps that
# Direct3D 7 surface in a desktop-sized borderless presentation at 4:3.
FullscreenMode = borderless
AltTabFix = keepvidmem(1)
DisplayAspectRatio = 4:3
DesktopResolution = desktop
DisplayResolution = desktop
DisplayFilter = bilinear(0)
ResolutionScale = display(1)
ResolutionScaleFilter = bilinear
SupportedResolutions = 800x600, 1024x768
VSync = on
LogLevel = info
