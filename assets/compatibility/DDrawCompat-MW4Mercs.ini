# MechWarrior 4: Mercenaries presentation profile.
# Mercenaries' DirectShow movie window transiently changes activation. Hiding
# that transition from both DirectDraw and the game keeps its movie surfaces
# resident while retaining the wrapper's borderless Alt-Tab path.
FullscreenMode = borderless
AltTabFix = noactivateapp(0)
DisplayAspectRatio = 4:3
DesktopResolution = desktop
DisplayResolution = desktop
DisplayFilter = bilinear(0)
ResolutionScale = display(1)
ResolutionScaleFilter = bilinear
SupportedResolutions = 800x600, 1024x768
VSync = on
LogLevel = info
